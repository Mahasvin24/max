<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Max · Vortex</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vortex.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Max identity</p><h1>Vortex</h1></div>
      <nav aria-label="Download logo">
        <a href="max-vortex.svg" download>Download SVG <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <section class="hero" aria-label="Vortex preview">
      <div class="hero-stage"><div class="hero-mark" id="hero-mark" data-vortex></div></div>
      <div class="motion-controls" aria-label="Motion preview">
        <button id="rotate" type="button" aria-pressed="false">Rotate</button>
        <button id="collapse" type="button" aria-pressed="false">Collapse to dot</button>
      </div>
    </section>
    <section class="sizes" aria-labelledby="sizes-title">
      <div class="section-heading"><h2 id="sizes-title">At every size</h2><p>Actual pixels. The same vector.</p></div>
      <div class="size-strip dark" data-size-strip aria-label="White logo on dark background"></div>
      <div class="size-strip light" data-size-strip aria-label="Black logo on light background"></div>
    </section>
    <footer><p>Six curved arms, one continuous rhythm.</p><span>Transparent vector · Fits any square</span></footer>
    <noscript><p>JavaScript is needed for motion and size previews. The <a href="max-vortex.svg">standalone SVG</a> works without it.</p></noscript>
  </main>
</body>
</html>
